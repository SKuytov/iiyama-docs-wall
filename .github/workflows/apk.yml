name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'apk/**'
      - 'web/**'
      - 'tools/build-manifest.py'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write   # to upload the APK as a release asset

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Use the same script developers run locally, so CI and a local build
      # produce byte-identical assets. It refreshes manifest.json and strips
      # the staff-facing editor, which has no business inside the APK.
      - name: Bundle web/ into APK assets
        run: ./tools/rebuild-bundle.sh

      - name: Verify the editor is not bundled
        run: |
          if ls apk/app/src/main/assets/web/editor.* \
                apk/app/src/main/assets/web/save.php >/dev/null 2>&1; then
            echo "::error::editor files leaked into the APK assets"; exit 1
          fi
          echo "✓ editor excluded"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apk/**/*.gradle*', 'apk/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build release APK
        working-directory: apk
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp apk/app/build/outputs/apk/release/app-release.apk \
             artifacts/iiyama-docs-wall-${{ github.sha }}.apk
          cp apk/app/build/outputs/apk/release/app-release.apk \
             artifacts/iiyama-docs-wall-latest.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: iiyama-docs-wall-apk
          path: artifacts/*.apk
          retention-days: 90

      - name: Update rolling "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: iiyama-docs-wall (latest build)
          body: |
            Auto-built from commit ${{ github.sha }}.
            Install on the iiyama panel:
            ```
            adb install -r iiyama-docs-wall-latest.apk
            ```
          files: artifacts/iiyama-docs-wall-latest.apk
          prerelease: false
          make_latest: true
