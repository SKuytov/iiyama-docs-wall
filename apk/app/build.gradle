plugins { id 'com.android.application' }

android {
    namespace 'bg.septona.docswall'
    compileSdk 34

    defaultConfig {
        applicationId "bg.septona.docswall"
        minSdk 21          // Android 5.0 — matches iiyama signage SoCs
        targetSdk 34
        versionCode 6
        versionName "2.4.0"

        // Baked-in fallback URL. Overridden by BuildConfig field so CI can inject a different origin.
        // Where the panel will look for updates. Uploads to this folder
        // (1.html, style.css, app.js, sw.js, assets/…, manifest.json) will
        // be auto-fetched, hash-verified, and applied on the panel.
        buildConfigField "String", "SIGNAGE_ORIGIN", "\"https://skuytov.eu/ii\""
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled false
            // Uses debug signing so a plain `./gradlew assembleRelease` produces an installable APK.
            // For production, replace with a real keystore.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        // We don't want a minor lint warning to break the release build in CI;
        // real errors (compile, resource) still fail. Fatal issues are caught by tests/runtime.
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.work:work-runtime:2.9.1'
}
