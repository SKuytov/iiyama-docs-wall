plugins { id 'com.android.application' }

android {
    namespace 'bg.septona.docswall'
    compileSdk 34

    defaultConfig {
        applicationId "bg.septona.docswall"
        minSdk 21          // Android 5.0 — matches iiyama SoC panels
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // replace with a real keystore for production
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
