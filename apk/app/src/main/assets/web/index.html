<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <!-- Must be device-width: a fixed width=3840 combined with initial-scale=1
       makes the panel render only the top-left 1920x1080 of the page. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Septona Bulgaria — Информационно табло</title>
  <!-- No `crossorigin` here on purpose: the APK loads this page from a file://
       origin, where a CORS-mode font fetch is rejected outright. Same-origin
       preload works on both file:// and https://. -->
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/golos-cyrillic.woff2" />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/inter-cyrillic.woff2" />
  <link rel="preload" as="image" href="assets/cotton-bg-1.jpg" />
  <link rel="preload" as="image" href="assets/septona-logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============================================================
     ICON SPRITE
     ISO-7010-inspired pictograms. Stroke-based, inherit currentColor,
     so a single sprite serves every accent colour on the board.
     Referenced from render.js by name, e.g. icon: 'vest' -> #i-vest.
     ============================================================ -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <!-- hi-vis vest -->
    <symbol id="i-vest" viewBox="0 0 24 24">
      <path d="M9 3l3 3 3-3 4 2.2v15.3H5V5.2z"/><path d="M12 6v15"/>
      <path d="M8 10h2M8 13.5h2M14 10h2M14 13.5h2"/>
    </symbol>
    <!-- safety boot -->
    <symbol id="i-boot" viewBox="0 0 24 24">
      <path d="M6 4h4v7l8 3.2c1.4.6 2 1.6 2 3.1V20H6z"/><path d="M6 16.5h14"/>
    </symbol>
    <!-- speed limit -->
    <symbol id="i-speed" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/><path d="M12 12l4.2-4.2"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
      <path d="M12 3v2M21 12h-2M12 21v-2M3 12h2"/>
    </symbol>
    <!-- engine off -->
    <symbol id="i-engine" viewBox="0 0 24 24">
      <path d="M8.5 4.5a5 5 0 017 0"/><path d="M6.2 7.2a8.5 8.5 0 0111.6 0"/>
      <path d="M12 11v5"/><circle cx="12" cy="19" r="2.4"/>
    </symbol>
    <!-- wheel chock -->
    <symbol id="i-chock" viewBox="0 0 24 24">
      <circle cx="10" cy="10" r="6.2"/><circle cx="10" cy="10" r="2"/>
      <path d="M2 21h20"/><path d="M16 21l4.5-6H22v6z" fill="currentColor" stroke="none"/>
    </symbol>
    <!-- secured load -->
    <symbol id="i-strap" viewBox="0 0 24 24">
      <rect x="3.5" y="7" width="17" height="12" rx="1"/><path d="M8.5 4v18M15.5 4v18"/>
      <path d="M3.5 12.8h17"/>
    </symbol>
    <!-- no smoking -->
    <symbol id="i-nosmoke" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9.2"/><path d="M5.5 5.5L18.5 18.5"/>
      <path d="M6 14.2h9"/><path d="M17 14.2h1.6"/><path d="M15 11.2c1.6-.9 1.6-2.4 0-3.4"/>
    </symbol>
    <!-- no eating -->
    <symbol id="i-noeat" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9.2"/><path d="M5.5 5.5L18.5 18.5"/>
      <path d="M9 7.2v4.2M9 11.4V17"/><path d="M15 7.2c1.4 0 2 1 2 2.4S16.4 12 15 12v5"/>
    </symbol>
    <!-- no entry -->
    <symbol id="i-noentry" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9.2"/><path d="M6.6 12h10.8" stroke-width="3.2"/>
    </symbol>
    <!-- stay in cabin -->
    <symbol id="i-cabin" viewBox="0 0 24 24">
      <path d="M3 16.5V8.5A1.5 1.5 0 014.5 7h6.2l3.3 4h4.5A1.5 1.5 0 0120 12.5v4z"/>
      <circle cx="7.2" cy="18.4" r="1.9"/><circle cx="16.6" cy="18.4" r="1.9"/>
      <path d="M9 18.4h5.7"/>
    </symbol>
    <!-- documents -->
    <symbol id="i-doc" viewBox="0 0 24 24">
      <path d="M6 3h8l4.5 4.5V21H6z"/><path d="M13.6 3v5h4.9"/><path d="M9 12h6M9 15.4h6M9 18.2h3.6"/>
    </symbol>
    <!-- signed &amp; stamped -->
    <symbol id="i-stamp" viewBox="0 0 24 24">
      <path d="M5 3h8l4.5 4.5V15H5z"/><path d="M12.6 3v5h4.9"/>
      <circle cx="16" cy="18" r="4.4"/><path d="M14.1 18l1.5 1.6 2.5-3"/>
    </symbol>
    <!-- toilets -->
    <symbol id="i-toilet" viewBox="0 0 24 24">
      <circle cx="7" cy="4.6" r="2"/><path d="M7 7.2c-1.7 0-2.6 1-2.6 2.6V15h1.3l.5 6h1.6l.5-6h1.3V9.8C9.6 8.2 8.7 7.2 7 7.2z"/>
      <circle cx="17" cy="4.6" r="2"/><path d="M17 7.2c-1.8 0-2.7 1-3 2.6L13 15h1.9l.4 6h3.4l.4-6H21l-1-5.2c-.3-1.6-1.2-2.6-3-2.6z"/>
      <path d="M12 3.4v17.2"/>
    </symbol>
    <!-- parking -->
    <symbol id="i-parking" viewBox="0 0 24 24">
      <rect x="3.4" y="3.4" width="17.2" height="17.2" rx="2"/>
      <path d="M9.6 17V7h3.2a3.1 3.1 0 010 6.2H9.6"/>
    </symbol>
    <!-- no alcohol / drugs -->
    <symbol id="i-noalcohol" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9.2"/><path d="M5.5 5.5L18.5 18.5"/>
      <path d="M8.6 6.6h6.8l-2.4 5v5.8"/><path d="M10 18.6h5.2"/>
    </symbol>
    <!-- report incident -->
    <symbol id="i-alert" viewBox="0 0 24 24">
      <path d="M12 3.4L22 20.6H2z"/><path d="M12 9.4v5"/>
      <circle cx="12" cy="17.6" r="1.1" fill="currentColor" stroke="none"/>
    </symbol>
    <!-- CCTV -->
    <symbol id="i-cctv" viewBox="0 0 24 24">
      <path d="M2.6 8.4l14.2-3.8 1.5 5.6L4.1 14z"/><path d="M6 13.2l1.4 4.2"/>
      <path d="M12 4.2V21"/><path d="M18.3 10.2l3.1-.8"/>
    </symbol>
    <!-- face mask -->
    <symbol id="i-mask" viewBox="0 0 24 24">
      <path d="M4.5 8.6l7.5-1.6 7.5 1.6v4.6c0 2.6-3.4 4.8-7.5 4.8s-7.5-2.2-7.5-4.8z"/>
      <path d="M4.5 10.6H1.8M22.2 10.6h-2.7"/><path d="M7.5 11.6h9M7.5 14.2h9"/>
    </symbol>
    <!-- waste / recycling -->
    <symbol id="i-waste" viewBox="0 0 24 24">
      <path d="M12 3.6l2.6 4.4h-5.2z" fill="currentColor" stroke="none"/>
      <path d="M4.6 16.4l2.6-4.5 2.2 1.3-2.6 4.5z"/><path d="M19.4 16.4l-2.6-4.5-2.2 1.3 2.6 4.5z"/>
      <path d="M7 20.4h10"/>
    </symbol>
    <!-- kiosk / touch -->
    <symbol id="i-kiosk" viewBox="0 0 24 24">
      <rect x="4" y="2.6" width="16" height="13" rx="1.4"/><path d="M9 19h6M12 15.6V19"/>
      <path d="M7.4 21.4h9.2"/>
      <circle cx="12" cy="9" r="2.6"/>
    </symbol>
    <!-- phone -->
    <symbol id="i-phone" viewBox="0 0 24 24">
      <path d="M6.4 3.6h3l1.6 4-2 1.4a12 12 0 006 6l1.4-2 4 1.6v3c0 1-.8 1.8-1.8 1.7C11.3 20.5 3.5 12.7 2.7 5.4A1.7 1.7 0 014.4 3.6z"/>
    </symbol>
    <!-- checklist / programme -->
    <symbol id="i-list" viewBox="0 0 24 24">
      <path d="M4 6.2l1.8 1.8L9 4.8"/><path d="M4 13l1.8 1.8L9 11.6"/><path d="M4 19.8l1.8 1.8L9 18.4"/>
      <path d="M12 6.6h8M12 13.4h8M12 20.2h8"/>
    </symbol>
    <!-- committee / people -->
    <symbol id="i-people" viewBox="0 0 24 24">
      <circle cx="8.4" cy="7.6" r="3"/><path d="M2.6 20.4c0-3.2 2.6-5.4 5.8-5.4s5.8 2.2 5.8 5.4"/>
      <circle cx="17" cy="8.6" r="2.4"/><path d="M14.6 15.4c2.8-.6 6.8.6 6.8 5"/>
    </symbol>
    <!-- fire -->
    <symbol id="i-fire" viewBox="0 0 24 24">
      <path d="M12 2.6s5.4 4.6 5.4 9.8a5.4 5.4 0 01-10.8 0C6.6 9.6 9 7 9 7s.6 2.2 2 2.2c1.6 0 1.6-4.4 1-6.6z"/>
      <path d="M12 21.4v-4"/>
    </symbol>
    <!-- cleaning -->
    <symbol id="i-clean" viewBox="0 0 24 24">
      <path d="M9.4 2.6h5.2v6.2H9.4z"/><path d="M7.6 8.8h8.8l1.5 12.6H6.1z"/>
      <path d="M8.2 14.4h7.6"/><path d="M11 8.8v5.6M13 8.8v5.6"/>
    </symbol>
    <!-- inspection / check -->
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="M7 3.4h10a1.6 1.6 0 011.6 1.6v15.6H5.4V5A1.6 1.6 0 017 3.4z"/>
      <path d="M8.6 11.6l2.2 2.2 4.6-4.6"/><path d="M8.6 17.4h6.8"/>
      <path d="M9.4 3.4V2M14.6 3.4V2"/>
    </symbol>
    <!-- calendar -->
    <symbol id="i-calendar" viewBox="0 0 24 24">
      <rect x="3.6" y="5" width="16.8" height="15.4" rx="1.6"/>
      <path d="M3.6 9.6h16.8"/><path d="M8 5V2.8M16 5V2.8"/>
      <path d="M7.6 13.4h2.4M13.9 13.4h2.4M7.6 17h2.4M13.9 17h2.4"/>
    </symbol>
  </defs>
</svg>
  <!-- ============ DOCS VIEW ============
       Intentionally empty. render.js builds this from the data in content.js,
       so all edits happen in one plain-text file and cannot produce malformed
       markup. -->
  <section class="view view-docs is-active" id="docsView" aria-label="Информационно табло"></section>

<!-- ============ SPLASH VIEW (burn-in relief) ============ -->
  <section class="view view-splash" id="splashView" aria-hidden="true">
    <div class="stage">
      <div class="bg-slide bg-slide-1 is-active" id="bgSlide1"></div>
      <div class="bg-slide bg-slide-2"          id="bgSlide2"></div>
      <div class="bg-vignette"></div>

      <div class="particles" id="particles"></div>

      <div class="live-clock">
        <div class="clock-time" id="clockTime">00:00:00</div>
        <div class="clock-date" id="clockDate"></div>
      </div>

      <div class="logo-center">
        <img class="logo-img" src="assets/septona-logo.png" alt="Septona Bulgaria" />
      </div>
    </div>
  </section>

  <!-- content.js  = the ONLY file to edit for content changes
       render.js   = turns that data into the board
       app.js      = view cycling, clock, splash animation, burn-in drift -->
  <script src="content.js"></script>
  <script src="render.js"></script>
  <script src="app.js"></script>
</body>
</html>
