<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <!-- Must be device-width: a fixed width=3840 combined with initial-scale=1 makes the
       panel render only the top-left 1920x1080 of the page. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Septona Bulgaria — Информационно табло</title>
  <link rel="preload" as="image" href="assets/board.jpg" />
  <link rel="preload" as="image" href="assets/cotton-bg-1.jpg" />
  <link rel="preload" as="image" href="assets/septona-logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ DOCS VIEW ============ -->
  <section class="view view-docs is-active" id="docsView" aria-label="Документи">
    <img class="board-img" src="assets/board.jpg" alt="Информационно табло — актуални заповеди, програми и телефони" />
    <!-- Sub-pixel drift wrapper handles pixel-level anti-burn-in shift -->
  </section>

  <!-- ============ SPLASH VIEW (burn-in relief) ============ -->
  <section class="view view-splash" id="splashView" aria-hidden="true">
    <div class="stage">
      <div class="bg-slide bg-slide-1 is-active" id="bgSlide1"></div>
      <div class="bg-slide bg-slide-2"          id="bgSlide2"></div>
      <div class="bg-vignette"></div>

      <div class="particles" id="particles"></div>

      <div class="live-clock">
        <div class="clock-time" id="clockTime">00:00:00</div>
        <div class="clock-date" id="clockDate"></div>
      </div>

      <div class="logo-center">
        <img class="logo-img" src="assets/septona-logo.png" alt="Septona Bulgaria" />
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
